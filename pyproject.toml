[project]
name = "modelbot"
version = "0.1.0"
description = "Dependabot for LLMs: eval-gated model upgrades with agent-driven prompt porting on Amazon Bedrock"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.22",
  "strands-agents>=1.0",
  "PyGithub>=2.3",
]

[project.scripts]
modelbot = "modelbot.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelbot"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
