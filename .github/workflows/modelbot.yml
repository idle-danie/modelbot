# Weekly model-upgrade check for the examples in this repository.
# Inactive unless the MODELBOT_ENABLED variable is "true"; the role ARN is kept in the MODELBOT_ROLE_ARN secret so the
# AWS account ID is masked in logs (see README → "Run in GitHub Actions").
name: modelbot
on:
  # Uncomment to run weekly. Each run spends real Bedrock money (capped by budget_usd per example).
  # schedule:
  #   - cron: "0 0 * * 1" # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  id-token: write # OIDC to AWS
  contents: write # push the upgrade branch
  pull-requests: write

concurrency: modelbot

jobs:
  upgrade:
    if: vars.MODELBOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [ticket-classifier, email-extractor]
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          role-to-assume: ${{ secrets.MODELBOT_ROLE_ARN }}
          config: examples/${{ matrix.example }}/modelbot.yaml
          args: --max-candidates 2
