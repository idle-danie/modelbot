name: modelbot
description: Dependabot for LLMs - eval-gated model upgrades on Amazon Bedrock
branding: {icon: cpu, color: orange}
inputs:
  role-to-assume:
    description: IAM role ARN trusted for GitHub OIDC (deploy infra/github-oidc-role.yaml)
    required: true
  aws-region:
    description: AWS region for Bedrock
    default: us-east-1
  config:
    description: Path to modelbot.yaml
    default: modelbot.yaml
  args:
    description: Extra arguments for `modelbot run`, e.g. "--repeats 3 --max-candidates 2"
    default: ""
  github-token:
    description: Token used to open pull requests
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - uses: astral-sh/setup-uv@v6
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        uvx --from "${{ github.action_path }}" modelbot run \
          --config "${{ inputs.config }}" --open-pr ${{ inputs.args }} | tee -a "$GITHUB_STEP_SUMMARY"
