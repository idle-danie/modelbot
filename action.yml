name: modelbot
description: Dependabot for LLMs - eval-gated model upgrades on Amazon Bedrock
branding: {icon: cpu, color: orange}
inputs:
  role-to-assume:
    description: IAM role ARN trusted for GitHub OIDC (see design.md for minimum permissions)
    required: true
  aws-region:
    description: AWS region for Bedrock
    default: us-east-1
  config:
    description: Path to modelbot.yaml
    default: modelbot.yaml
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - uses: astral-sh/setup-uv@v6
    - shell: bash
      run: uvx --from "${{ github.action_path }}" modelbot run --config "${{ inputs.config }}" --open-pr
